# Eclipse Mosquitto configuration for VajraX Cloud MQTT Broker
# Supports both plaintext (dev) and TLS/mTLS (required for satellite sync)

# --------------------------------------------------------------------------
# Plaintext listener (local development only — DISABLE IN PRODUCTION)
# --------------------------------------------------------------------------
listener 1883
allow_anonymous true

# --------------------------------------------------------------------------
# TLS/mTLS listener
# Requires client certificates signed by the VajraX Station CA
# --------------------------------------------------------------------------
listener 8883
protocol mqtt

# TLS configuration
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Require client certificates (mTLS)
require_certificate true
use_identity_as_username true

tls_version tlsv1.3

# --------------------------------------------------------------------------
# Persistence (required for QoS 1/2 delivery across broker restarts)
# --------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --------------------------------------------------------------------------
# MQTT 5 protocol support
# --------------------------------------------------------------------------
# Max message size (10 MB — allows large black-box frame batches)
max_packet_size 10485760

# Message queue for clients with QoS 1/2 subscriptions (offline delivery)
max_queued_messages 10000

# Maximum inflight QoS 1/2 messages per client
max_inflight_messages 100

# Session expiry for persistent sessions (7 days)
persistent_client_expiration 7d
