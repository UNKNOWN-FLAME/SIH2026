# VajraX Test Docker Compose
# Ephemeral infrastructure for e2e tests — all volumes are anonymous and
# destroyed with `docker compose down -v` after each test run.
#
# Usage: make test-e2e  (handles up/down automatically)

version: "3.9"

networks:
  edge-maitri-test:
    driver: bridge
  edge-bharati-test:
    driver: bridge
  cloud-test:
    driver: bridge
  satellite-link-test:
    driver: bridge

services:

  postgres-edge-maitri-test:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: vajrax_edge_test
      POSTGRES_USER: vajrax_edge
      POSTGRES_PASSWORD: edge_test_secret
    networks:
      - edge-maitri-test
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vajrax_edge -d vajrax_edge_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-edge-bharati-test:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: vajrax_edge_test
      POSTGRES_USER: vajrax_edge
      POSTGRES_PASSWORD: edge_test_secret
    networks:
      - edge-bharati-test
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vajrax_edge -d vajrax_edge_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-cloud-test:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: vajrax_cloud_test
      POSTGRES_USER: vajrax_cloud
      POSTGRES_PASSWORD: cloud_test_secret
    networks:
      - cloud-test
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vajrax_cloud -d vajrax_cloud_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-maitri-test:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - edge-maitri-test
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-bharati-test:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - edge-bharati-test
    ports:
      - "6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto-test:
    image: eclipse-mosquitto:2
    volumes:
      - ../docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - cloud-test
      - satellite-link-test
    ports:
      - "1884:1883"   # plaintext only for tests
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vajrax_test
      MINIO_ROOT_PASSWORD: minio_test_secret
    networks:
      - cloud-test
    ports:
      - "9010:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
